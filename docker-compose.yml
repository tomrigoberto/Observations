services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: observations
      POSTGRES_PASSWORD: observations
      POSTGRES_DB: observations
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observations"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://observations:observations@postgres:5432/observations
      LIBRARY_PATH: /library
      UPLOAD_PATH: /storage/uploads
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app
      - ../observations-library:/library:ro
      - storage:/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
  storage:
  frontend_node_modules:
